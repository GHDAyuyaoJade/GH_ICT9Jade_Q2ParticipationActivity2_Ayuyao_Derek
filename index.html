<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<title>Tables and Images with Bootstrap</title>
</head>
<body>
<h2 class="text-center mx-auto d-block col-lg-4">Naruto Characters - Team 7<h2>
<div class="row">
<img class="rounded mx-auto d-block col-lg-4" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuIfF2H0LH6Ip2NS11rVuyR2SRAfc6568jYpSQZQSAFQ&s=10" alt="Sasuke" height=300px width=100px>
<img class="rounded-circle mx-auto d-block col-lg-4" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQF2DjkYtkyXGjB_gdpQ7ng9khTe5rUWpHDg1C4Wn3cdg&s=10" alt="Sakura" height=300px width=100px>
<img class="img-thumbnail mx-auto d-block col-lg-4" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQCeA_I0W_9Q8GBolQL3-W1-2J1IIeflL_2ESw9GhJz0N_5yDeF8wo60Pc&s=10" alt="Uzumaki Naruto" height=300px width=100px>
</div>
<h1 class="text-center">Bootstrap Table</h1>
<img class="mx-auto d-block" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTeiSfQZASApEOfIOSOpO4USXa6F_C0BpsV3ub1bvkTCA&s=10" alt="Spiderman" height="300px" width="250px">
<table class="table table-striped table-hover table-dark container">
    <tr>
        <th class="bg-primary" scope="col">Name</th>
        <th class="bg-primary" scope="col">Favorite Anime</th>
        <th class="bg-primary" scope="col">Protagonist</th>
    </tr>
    <tr>
        <td>Derek Ayuyao</td>
        <td>Re:Zero</td>
        <th><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROPzqF7AUZiTnBBW9OLoZoxcdlYMWFhDd0kTr4Vjo-UA&s=10" alt="Natsuki Subaru" height="150" width="150"></th>
    </tr>
    <tr>
        <td>Dyce Aquino</td>
        <td>One Piece</td>
        <th><img src="https://static0.gamerantimages.com/wordpress/wp-content/uploads/2025/10/luffy-new-power-up.png?w=1600&h=900&fit=crop" alt="Natsuki Subaru" height="150" width="150"></th>
    </tr>
    <tr>
        <td>Arsean Urbano</td>
        <td>Horimiya</td>
        <th><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDnOGjHaTlQIFWxVUgg5CkThte3-s4IdIrY_Kyv1ndqQ&s=10" alt="Natsuki Subaru" height="150" width="150"></th>
    </tr>
</table>

</html>
